<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function () {
        var hash = window.location.hash || "";
        var search = window.location.search || "";
        var hasOAuthHash = hash.indexOf("access_token=") !== -1 || hash.indexOf("refresh_token=") !== -1;
        var target = hasOAuthHash ? "/auth/callback" + hash : "/" + search + hash;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
