<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function () {
        var hash = window.location.hash || "";
        var hasOAuthHash = hash.indexOf("access_token=") !== -1 || hash.indexOf("refresh_token=") !== -1;
        if (hasOAuthHash) {
          window.location.replace("/auth/callback" + hash);
          return;
        }

        // GitHub Pages has no server-side rewrites, so a hard refresh on a
        // deep link (e.g. /dashboard) hits this 404 page. Stash the intended
        // path and hand off to index.html, which restores it before the app
        // mounts so React Router lands on the right route instead of "/".
        var redirect = window.location.pathname + window.location.search + hash;
        sessionStorage.setItem("spa-redirect", redirect);
        window.location.replace("/");
      })();
    </script>
  </body>
</html>
